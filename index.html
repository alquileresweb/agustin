<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inmobiliaria - Alqui Ya</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background-color: #f8f8f8;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .logo img {
      height: 50px;
    }
    .menu {
      display: flex;
      gap: 20px;
    }
    .menu a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #fff;
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
    }
    .dropdown-content a {
      color: #333;
      padding: 12px 16px;
      display: block;
      text-decoration: none;
    }
    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }
    .contact-btn {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .contact-btn:hover {
      background-color: #0056b3;
    }
    .iframe-container {
      width: 100%;
      height: calc(100vh - 90px); /* Adjust height to fit below header */
      border: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }
    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading-message {
      position: absolute;
      font-size: 1.2em;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="https://i.postimg.cc/kGCHpwT8/Whats-App-Image-2025-10-02-at-14-31-24.jpg" alt="Logo Alqui Ya">
    </div>
    <div class="menu">
      <a href="#">Inicio</a>
      <div class="dropdown">
        <a href="#">Vendé</a>
        <div class="dropdown-content">
          <a href="#">Terreno</a>
          <a href="#">Departamento</a>
          <a href="#">Casa</a>
          <a href="#">Local Comercial</a>
          <a href="#">Otro</a>
        </div>
      </div>
      <div class="dropdown">
        <a href="#">Comprá</a>
        <div class="dropdown-content">
          <a href="#">Terreno</a>
          <a href="#">Departamento</a>
          <a href="#">Casa</a>
          <a href="#">Local Comercial</a>
          <a href="#">Otro</a>
          <a href="#">Ver Todos</a>
        </div>
      </div>
      <div class="dropdown">
        <a href="#">Alquilá</a>
        <div class="dropdown-content">
          <a href="#">Monoambiente</a>
          <a href="#">2 Ambientes</a>
          <a href="#">3 Ambientes</a>
          <a href="#">Otro</a>
          <a href="#">Ver Todos</a>
        </div>
      </div>
      <a href="#">Invertí</a>
    </div>
    <button class="contact-btn">Contactar</button>
  </div>
  <div class="iframe-container">
    <span class="loading-message">Cargando propiedades...</span>
    <iframe src="https://www.alquiya.com.ar/inmobiliarias.html?axel.martinezz665@gmail.com" onload="document.querySelector('.loading-message').style.display='none';"></iframe>
  </div>
</body>
</html>
