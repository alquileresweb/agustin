<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inmobiliaria - Alqui Ya</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background-color: #000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .logo img {
      height: 80px;
    }
    .menu {
      display: flex;
      gap: 20px;
    }
    .menu a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #fff;
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
    }
    .dropdown-content a {
      color: #333;
      padding: 12px 16px;
      display: block;
      text-decoration: none;
    }
    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }
    .contact-btn {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .contact-btn:hover {
      background-color: #0056b3;
    }
    .main-container {
      display: flex;
      height: calc(100vh - 90px);
    }
    .sidebar {
      width: 40%;
      background-color: #f0f0f0;
      border-right: 1px solid #ccc;
      position: relative;
      display: none;
      height: 600px;
    }
    .sidebar.active {
      display: block;
    }
    .sidebar iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading-message {
      position: absolute;
      font-size: 1.2em;
      color: #333;
      top: 50%;
      left: 50px;
    }
    .content-area {
      flex: 1;
      padding: 20px;
      background-color: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .content-area.active {
      display: flex;
    }
    .pre-tasacion-btn {
      background-color: #28a745;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    .pre-tasacion-btn:hover {
      background-color: #218838;
    }
    .section-text {
      font-size: 1.5em;
      margin: 20px 0;
      text-align: center;
    }
    .boxes {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .box {
      background-color: #f8f8f8;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      width: 200px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .benefits-text {
      font-size: 1.3em;
      margin: 20px 0;
      text-align: center;
    }
    .benefits-boxes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      justify-items: center;
      max-width: 1200px;
    }
    .benefit-box img {
      width: 100%;
      max-width: 300px;
      height: auto;
      border-radius: 5px;
    }
    .inicio-content img {
      max-width: 100%;
      width: 100%;
      max-width: 1200px;
      height: auto;
      border-radius: 5px;
    }
    .compra-content {
      display: flex;
      flex: 2;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 600px;
      margin-top: 20px;
    }
    .image-item {
      text-align: center;
    }
    .image-item img {
      width: 100%;
      max-width: 250px;
      height: auto;
      border-radius: 5px;
    }
    .image-item p {
      margin: 10px 0 0;
      font-size: 1.1em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="https://i.postimg.cc/kGCHpwT8/Whats-App-Image-2025-10-02-at-14-31-24.jpg" alt="Logo Alqui Ya">
    </div>
    <div class="menu">
      <a href="#" class="menu-link" id="inicio-link">Inicio</a>
      <a href="#" class="menu-link" id="vende-link">Vendé</a>
      <a href="#" class="menu-link" id="compra-link">Comprá</a>
      <a href="#" class="menu-link" id="alquila-link">Alquilá</a>
      <a href="#" class="menu-link" id="inverti-link">Invertí</a>
    </div>
    <button class="contact-btn">Contactar</button>
  </div>
  <div class="main-container">
    <div class="sidebar" id="sidebar">
      <span class="loading-message">Cargando propiedades...</span>
      <iframe src="https://alquiya.com.ar/inmobiliarias.html?email=axel.martinezz665@gmail.com" onload="document.querySelector('.loading-message').style.display='none';"></iframe>
    </div>
    <div class="content-area active" id="inicio-content">
      <img src="https://i.postimg.cc/CKcJZtzp/1-2.png" alt="Inicio Imagen">
    </div>
    <div class="content-area" id="vende-content">
      <button class="pre-tasacion-btn">Pre Tasación GRATUITA</button>
      <div class="section-text">No solo lo vendemos, sino que también...</div>
      <div class="boxes">
        <div class="box">Lo Promocionamos</div>
        <div class="box">Tasamos tu Propiedad</div>
      </div>
      <div class="benefits-text">Y además tenés BENEFICIOS para vos</div>
      <div class="benefits-boxes">
        <div class="benefit-box"><img src="https://i.postimg.cc/5NTLYJ4b/1.png" alt="Beneficio 1"></div>
        <div class="benefit-box"><img src="https://i.postimg.cc/0NdwBJp1/2.png" alt="Beneficio 2"></div>
        <div class="benefit-box"><img src="https://i.postimg.cc/pry5rG43/3.png" alt="Beneficio 3"></div>
        <div class="benefit-box"><img src="https://i.postimg.cc/VLx0sFgw/4.png" alt="Beneficio 4"></div>
        <div class="benefit-box"><img src="https://i.postimg.cc/LX8nQQ9Z/5.png" alt="Beneficio 5"></div>
        <div class="benefit-box"><img src="https://i.postimg.cc/d3z31q8L/6.png" alt="Beneficio 6"></div>
      </div>
    </div>
    <div class="content-area" id="compra-content">
      <div class="image-grid">
        <div class="image-item">
          <img src="https://i.postimg.cc/Vky6jL2K/7.png" alt="Terrenos">
          <p>Terrenos</p>
        </div>
        <div class="image-item">
          <img src="https://i.postimg.cc/xdn14pfZ/8.png" alt="Departamentos">
          <p>Departamentos</p>
        </div>
        <div class="image-item">
          <img src="https://i.postimg.cc/vBS8DQWS/9.png" alt="Casas">
          <p>Casas</p>
        </div>
        <div class="image-item">
          <img src="https://i.postimg.cc/3NsKCnfZ/10.png" alt="Locales Comerciales">
          <p>Locales Comerciales</p>
        </div>
      </div>
    </div>
  </div>
  <script>
    const sidebar = document.getElementById('sidebar');
    const vendeContent = document.getElementById('vende-content');
    const inicioContent = document.getElementById('inicio-content');
    const compraContent = document.getElementById('compra-content');
    
    document.getElementById('compra-link').addEventListener('click', function(e) {
      e.preventDefault();
      sidebar.classList.add('active');
      vendeContent.classList.remove('active');
      inicioContent.classList.remove('active');
      compraContent.classList.add('active');
      sidebar.querySelector('iframe').src = 'https://alquiya.com.ar/inmobiliarias.html?email=axel.martinezz665@gmail.com&tipo=comprar';
    });
    
    document.getElementById('alquila-link').addEventListener('click', function(e) {
      e.preventDefault();
      sidebar.classList.add('active');
      vendeContent.classList.remove('active');
      inicioContent.classList.remove('active');
      compraContent.classList.remove('active');
      sidebar.querySelector('iframe').src = 'https://alquiya.com.ar/inmobiliarias.html?email=axel.martinezz665@gmail.com&tipo=alquilar';
    });
    
    document.getElementById('vende-link').addEventListener('click', function(e) {
      e.preventDefault();
      sidebar.classList.remove('active');
      vendeContent.classList.add('active');
      inicioContent.classList.remove('active');
      compraContent.classList.remove('active');
    });
    
    document.getElementById('inicio-link').addEventListener('click', function(e) {
      e.preventDefault();
      sidebar.classList.remove('active');
      vendeContent.classList.remove('active');
      inicioContent.classList.add('active');
      compraContent.classList.remove('active');
    });
    
    document.getElementById('inverti-link').addEventListener('click', function(e) {
      e.preventDefault();
      sidebar.classList.remove('active');
      vendeContent.classList.remove('active');
      inicioContent.classList.remove('active');
      compraContent.classList.remove('active');
    });
  </script>
</body>
</html>
