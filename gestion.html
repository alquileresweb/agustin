<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión - Inmobiliaria</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #2d3748;
            line-height: 1.6;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .dashboard-header {
            background: linear-gradient(135deg, #4c51bf 0%, #667eea 100%);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            box-shadow: 0 4px 20px rgba(76,81,191,0.25);
        }
        .logo-container img {
            height: 70px;
            width: auto;
            border-radius: 8px;
            background: white;
            padding: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header-text h1 { font-size: 2.1rem; margin-bottom: 0.25rem; }
        .header-text p { opacity: 0.9; font-size: 1.05rem; }

        .quick-actions {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
        }
        .quick-actions h2 { margin-bottom: 1.5rem; color: #4a5568; }
        .action-buttons { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }

        .btn {
            padding: 1rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(102,126,234,0.35);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(102,126,234,0.45); }

        .btn-secondary {
            background: linear-gradient(135deg, #38a169, #48bb78);
            color: white;
        }
        .btn-secondary:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(56,161,105,0.4); }

        .btn-back {
            background: #718096;
            color: white;
            width: 100%;
            margin-top: 1rem;
        }
        .btn-back:hover { background: #5a7184; }

        /* Secciones ocultas por defecto */
        #form-section, #mis-propiedades-section { display: none; }

        /* Formulario */
        #form-section {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 1.6rem; }
        .form-group label { display: block; margin-bottom: 0.6rem; font-weight: 600; color: #4a5568; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .image-preview { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
        .image-preview img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
        }
        .btn-submit { margin-top: 1.5rem; width: 100%; padding: 1.2rem; font-size: 1.15rem; }

        .success, .error-message, .loading {
            padding: 1.2rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .success { background: #e6fffa; color: #0c8599; border: 1px solid #99e9f2; display: none; }
        .error-message { background: #fff5f5; color: #c92a2a; border: 1px solid #ffcccc; display: none; }
        .loading { display: none; background: #f8f9fa; color: #495057; }

        /* Mis Propiedades */
        .section-title { text-align: center; font-size: 1.9rem; margin: 1.5rem 0 2rem; color: #2d3748; }
        .property-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }
        .property-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .property-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.15);
        }
        .property-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .property-info { padding: 1.4rem; text-align: center; }
        .property-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.6rem; }
        .property-price { font-size: 1.45rem; color: #38a169; font-weight: 700; margin-bottom: 0.5rem; }
        .property-type { color: #718096; font-size: 1.05rem; margin-bottom: 1.2rem; }
        .action-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .btn-action {
            padding: 0.8rem 1.5rem;
            font-size: 0.98rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            color: white;
            transition: all 0.2s;
        }
        .btn-edit { background: #3182ce; }
        .btn-edit:hover { background: #2b6cb0; }
        .btn-delete { background: #e53e3e; }
        .btn-delete:hover { background: #c53030; }

        .loading-msg, .no-data-msg {
            text-align: center;
            padding: 4rem 1rem;
            font-size: 1.25rem;
            color: #718096;
        }

        @media (max-width: 768px) {
            .action-buttons { flex-direction: column; gap: 1rem; }
            .form-row { grid-template-columns: 1fr; }
            .property-grid { grid-template-columns: 1fr; }
        }

        /* Nuevos estilos para sección Interesados */
        #interesados-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-top: 2rem;
        }

        .interested-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .interested-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.4rem;
            transition: all 0.2s ease;
        }

        .interested-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }

        .interested-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #2d3748;
        }

        .interested-info {
            font-size: 0.98rem;
            color: #4a5568;
            margin: 0.4rem 0;
        }

        .interested-info strong {
            color: #2d3748;
        }

        .interested-message {
            margin-top: 1rem;
            padding: 0.9rem;
            background: #edf2f7;
            border-radius: 8px;
            font-size: 0.97rem;
            white-space: pre-wrap;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #25D366;
            color: white;
            padding: 0.7rem 1.4rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1rem;
            transition: all 0.2s;
        }

        .btn-whatsapp:hover {
            background: #20b058;
            transform: translateY(-2px);
        }

        .no-interesados {
            text-align: center;
            padding: 3rem 1rem;
            color: #718096;
            font-size: 1.15rem;
        }

        @media (max-width: 768px) {
            .interested-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="main-container">

    <div class="dashboard-header">
        <div class="logo-container">
            <img src="https://i.postimg.cc/NjpwgWCr/Whats-App-Image-2025-10-02-at-14-31-24.jpg" alt="Logo Inmobiliaria">
        </div>
        <div class="header-text">
            <h1>Panel de Gestión</h1>
            <p>Administración de anuncios inmobiliarios</p>
        </div>
    </div>

    <div class="quick-actions" id="actionsPanel">
        <h2>¿Qué deseas hacer?</h2>
        <div class="action-buttons">
            <button class="btn-primary" id="btnPublicar">Publicar Nuevo Anuncio</button>
            <button class="btn-secondary" id="btnMisPropiedades">Mis Propiedades</button>
        </div>
    </div>

    <!-- ==================================================
     FORMULARIO PUBLICAR / EDITAR
================================================== -->
<div id="form-section">
    <div class="success" id="successMessage"></div>
    <div class="error-message" id="errorMessage"></div>
    <div class="loading" id="loadingMessage">Procesando...</div>

    <form id="publicationForm">
        <!-- Campo oculto NECESARIO para identificar qué propiedad se está editando -->
        <input type="hidden" id="editId" name="editId" value="">

        <div class="form-group">
            <label for="titulo">Título de la Publicación *</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ej: Hermoso departamento 3 ambientes en Palermo" maxlength="100">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="tipo">Tipo de Operación *</label>
                <select id="tipo" name="tipo">
                    <option value="">Seleccionar tipo</option>
                    <option value="venta">Venta</option>
                    <option value="alquiler">Alquiler</option>
                </select>
            </div>
            <div class="form-group">
                <label for="subtipo">Tipo de Propiedad *</label>
                <select id="subtipo" name="subtipo">
                    <option value="">Seleccionar subtipo</option>
                    <option value="departamento">Departamento</option>
                    <option value="casa">Casa</option>
                    <option value="terreno">Terreno</option>
                    <option value="local">Local Comercial</option>
                    <option value="otro">Otro</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="precio">Precio *</label>
                <input type="number" id="precio" name="precio" placeholder="Ej: 250000" step="1000" min="0">
            </div>
            <div class="form-group">
                <label for="pais">País *</label>
                <select id="pais" name="pais">
                    <option value="">Seleccionar país</option>
                    <option value="Argentina">Argentina</option>
                    <option value="Brasil">Brasil</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="imagenes">Imágenes (múltiples permitidas)</label>
            <input type="file" id="imagenes" name="imagenes" accept="image/*" multiple>
            <small style="color:#718096; display:block; margin-top:6px;">
                Formatos: JPG, PNG, WebP · máx. 10MB por imagen<br>
                <strong>Al editar:</strong> deja vacío para mantener las imágenes actuales
            </small>
            <div class="image-preview" id="imagePreview"></div>
            <div class="upload-progress" id="uploadProgress" style="display:none; margin-top:12px;">
                <div id="uploadProgressBar" style="height:6px; background:#667eea; width:0%; border-radius:3px;"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción Detallada *</label>
            <textarea id="descripcion" name="descripcion" rows="6" maxlength="1000"
                      placeholder="Describe la propiedad, características, ubicación, amenities, etc..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-submit">Publicar Anuncio</button>
        <button type="button" class="btn btn-back" id="btnVolverForm">← Volver al Panel</button>
    </form>
</div>

    <!-- ==================================================
         MIS PROPIEDADES
    ================================================== -->
    <div id="mis-propiedades-section">
        <h2 class="section-title">Mis Propiedades Publicadas</h2>
        <div id="propiedades-list" class="property-grid">
            <div class="loading-msg">Cargando propiedades...</div>
        </div>
        <button class="btn btn-primary" id="btnVolverPropiedades" style="display:block; margin: 2.5rem auto; padding:1.1rem 2.5rem;">
            ← Volver al Panel
        </button>
    </div>

    <!-- ==================================================
         PANEL INTERESADOS - SIEMPRE VISIBLE DEBAJO DE LOS BOTONES
    ================================================== -->
    <div id="interesados-panel" class="quick-actions" style="margin-top: 1.5rem;">
        <h2>Interesados (CRM)</h2>
        <div id="interesados-list" class="interested-grid">
            <div class="loading-msg">Cargando interesados...</div>
        </div>
    </div>

</div>

<script>
// ============================================================================
// CONTROL DE VISIBILIDAD DE SECCIONES - versión más segura
// ============================================================================
const sections = {
    actions:     document.getElementById('actionsPanel'),
    form:        document.getElementById('form-section'),
    propiedades: document.getElementById('mis-propiedades-section'),
    interesados: document.getElementById('interesados-section')
};

const buttons = {
    publicar:       document.getElementById('btnPublicar'),
    misPropiedades: document.getElementById('btnMisPropiedades'),
    interesados:    document.getElementById('btnInteresados'),
    volverForm:     document.getElementById('btnVolverForm'),
    volverProp:     document.getElementById('btnVolverPropiedades'),
    volverInteresados: document.getElementById('btnVolverInteresados')
};

function showSection(sectionToShow) {
    Object.values(sections).forEach(s => {
        if (s) s.style.display = 'none';
    });
    if (sectionToShow && sections[sectionToShow]) {
        sections[sectionToShow].style.display = 'block';
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Asignar eventos solo si los elementos existen
if (buttons.publicar) {
    buttons.publicar.addEventListener('click', () => {
        document.getElementById('editId').value = '';
        document.querySelector('.btn-submit').textContent = 'Publicar Anuncio';
        showSection('form');
    });
}

if (buttons.misPropiedades) {
    buttons.misPropiedades.addEventListener('click', () => {
        showSection('propiedades');
        if (typeof loadMisPropiedades === 'function') loadMisPropiedades();
    });
}

if (buttons.interesados) {
    buttons.interesados.addEventListener('click', () => {
        showSection('interesados');
        if (typeof loadInteresados === 'function') loadInteresados();
    });
}

if (buttons.volverForm) {
    buttons.volverForm.addEventListener('click', () => showSection('actions'));
}

if (buttons.volverProp) {
    buttons.volverProp.addEventListener('click', () => showSection('actions'));
}

if (buttons.volverInteresados) {
    buttons.volverInteresados.addEventListener('click', () => showSection('actions'));
}

// Para debug inicial
console.log('Elementos encontrados:');
console.log('btnInteresados:', !!buttons.interesados);
console.log('interesados-section:', !!sections.interesados);

// ============================================================================
// CONFIGURACIÓN GLOBAL
// ============================================================================
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxnHD1WpiGrdXpilPf7yU7wb4OQqTT_dqszP0UblAvbQclpeEdifirPyh1oVGIaF8omlA/exec';
const ORIGIN = 'https://inmobiliariaagustinsantos.com.ar';

// Elementos del formulario
const publicationForm = document.getElementById('publicationForm');
const submitBtn = document.querySelector('.btn-submit');
const successMessage = document.getElementById('successMessage');
const errorMessage = document.getElementById('errorMessage');
const loadingMessage = document.getElementById('loadingMessage');
const imagePreview = document.getElementById('imagePreview');
const imagenesInput = document.getElementById('imagenes');
const uploadProgress = document.getElementById('uploadProgress');
const uploadProgressBar = document.getElementById('uploadProgressBar');

let uploadedImageUrls = [];
let isEditing = false;

// ============================================================================
// CLOUDINARY CONFIGURACIÓN Y FUNCIONES (IGUAL QUE EN publicar.html)
// ============================================================================
const CLOUDINARY_CONFIG = {
    CLOUD_NAME: 'dn4tjz4ck',
    UPLOAD_PRESET: 'preset_alquileres',
    API_URL: 'https://api.cloudinary.com/v1_1/dn4tjz4ck/image/upload',
    MAX_FILE_SIZE: 10 * 1024 * 1024, // 10MB
    ALLOWED_TYPES: ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'],
    MAX_RETRIES: 3,
    TIMEOUT: 30000
};

// === VALIDACIÓN DE ARCHIVO ===
function validarArchivo(file) {
    if (!file) throw new Error("No se recibió ningún archivo");

    if (file.size > CLOUDINARY_CONFIG.MAX_FILE_SIZE) {
        throw new Error(`Archivo demasiado grande: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB). Máximo 10MB`);
    }

    if (!CLOUDINARY_CONFIG.ALLOWED_TYPES.includes(file.type)) {
        throw new Error(`Tipo no permitido: ${file.name} (${file.type}). Solo JPG, PNG y WebP`);
    }

    return true;
}

// === CREAR FORMDATA PARA CLOUDINARY ===
function crearFormData(file, options = {}) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_CONFIG.UPLOAD_PRESET);

    if (options.folder) {
        formData.append('folder', options.folder);
    }

    return formData;
}

// === PROCESAR ARCHIVO INDIVIDUAL (con reintentos) ===
async function procesarArchivoIndividual(file, options = {}) {
    const { retryCount = 0 } = options;

    if (!validarArchivo(file)) {
        throw new Error(`Archivo inválido: ${file.name}`);
    }

    const formData = crearFormData(file, options);

    try {
        const response = await fetch(CLOUDINARY_CONFIG.API_URL, {
            method: 'POST',
            mode: 'cors',
            cache: 'no-cache',
            credentials: 'omit',
            body: formData,
            signal: AbortSignal.timeout(CLOUDINARY_CONFIG.TIMEOUT)
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();

        if (result.secure_url) {
            return result.secure_url;
        } else {
            throw new Error("Respuesta inválida de Cloudinary");
        }
    } catch (error) {
        if (retryCount < CLOUDINARY_CONFIG.MAX_RETRIES &&
            (error.name === 'TimeoutError' || error.message.includes('network') || error.message.includes('fetch'))) {
            
            console.log(`Reintentando subida de ${file.name} (${retryCount + 1}/${CLOUDINARY_CONFIG.MAX_RETRIES})`);
            await new Promise(r => setTimeout(r, 2000 * (retryCount + 1)));
            return procesarArchivoIndividual(file, { ...options, retryCount: retryCount + 1 });
        }
        throw error;
    }
}

// === SUBIR MÚLTIPLES IMÁGENES (función principal) ===
async function subirImagenesCloudinary(files, options = {}) {
    const {
        onProgress = null,
        onSuccess = null,
        onError = null,
        folder = `alquileres/${Date.now()}`
    } = options;

    const urls = [];
    const errors = [];
    let processed = 0;
    const total = files.length;

    const batchSize = 3; // Subir de a 3 para evitar rate limits

    for (let i = 0; i < total; i += batchSize) {
        const batch = files.slice(i, i + batchSize);
        const batchPromises = batch.map((file, index) =>
            procesarArchivoIndividual(file, { 
                folder,
                globalIndex: i + index,
                totalFiles: total 
            })
        );

        const batchResults = await Promise.allSettled(batchPromises);

        batchResults.forEach((result, batchIndex) => {
            processed++;
            const file = batch[batchIndex];

            if (result.status === 'fulfilled' && result.value) {
                urls.push(result.value);
                onSuccess?.(result.value);
            } else {
                const error = result.reason || new Error('Error desconocido');
                errors.push({ file: file.name, error: error.message });
                onError?.(error, file);
            }

            onProgress?.({
                progress: (processed / total) * 100,
                current: processed,
                total: total,
                status: result.status === 'fulfilled' ? 'success' : 'error',
                file: file
            });
        });

        // Pequeña pausa entre batches
        if (i + batchSize < total) {
            await new Promise(resolve => setTimeout(resolve, 800));
        }
    }

    return { urls, errors, success: errors.length === 0 };
}

// === FUNCIÓN QUE SE USA EN EL EVENTO change ===
async function subirImagenesMultiples(files) {
    uploadedImageUrls = [];
    uploadProgress.style.display = 'block';
    uploadProgressBar.style.width = '0%';

    try {
        const resultado = await subirImagenesCloudinary(files, {
            folder: `alquileres/${Date.now()}`,
            onProgress: (progress) => {
                uploadProgressBar.style.width = `${progress.progress}%`;
            },
            onSuccess: (url) => {
                uploadedImageUrls.push(url);
            },
            onError: (error, file) => {
                console.error(`Error subiendo ${file.name}:`, error);
            }
        });

        if (resultado.errors.length > 0) {
            alert(`${resultado.errors.length} imagen(es) no pudieron subirse. Se guardarán las que sí funcionaron.`);
        }

    } catch (error) {
        console.error('Error en subida masiva:', error);
        alert('Hubo un error al subir las imágenes. Intenta de nuevo.');
        uploadedImageUrls = [];
    } finally {
        uploadProgress.style.display = 'none';
        uploadProgressBar.style.width = '0%';
    }
}

// ============================================================================
// ENVÍO A GOOGLE SHEETS – soporta tanto crear como editar
// ============================================================================
async function enviarPublicacionCompleta(datos, isEdit = false, editId = '') {
    const payload = {
        action: isEdit ? 'editarPublicacion' : 'procesarPublicacionCompleta',
        id: isEdit ? editId : '',
        titulo: datos.titulo || '',
        tipo: datos.tipo || '',
        subtipo: datos.subtipo || '',
        precio: datos.precio || '',
        pais: datos.pais || '',
        descripcion: datos.descripcion || '',
        imagenes: uploadedImageUrls.join(',') || '',
        timestamp: new Date().toISOString(),
        origin: ORIGIN,
        hoja: 'Publicar'
    };

    console.log('Enviando payload (no-cors):', payload);

    try {
        // Primero intentamos con no-cors (funciona para POST en Apps Script)
        let response = await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',               // ← Esto es clave para evitar bloqueo CORS
            cache: 'no-cache',
            credentials: 'omit',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        console.log('Respuesta no-cors:', response.type); // Debe decir "opaque"

        // Si es opaque → éxito (Apps Script recibió el POST aunque no veamos la respuesta)
        if (response.type === 'opaque') {
            console.log('Éxito en no-cors (opaque response) - backend recibió los datos');
            return {
                success: true,
                message: isEdit ? 'Cambios enviados (no-cors)' : 'Publicación enviada (no-cors)'
            };
        }

        // Fallback: intentamos con cors (a veces funciona en GET pero no siempre en POST)
        console.log('Intentando fallback con cors...');
        response = await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'cors',
            cache: 'no-cache',
            credentials: 'omit',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            const json = await response.json();
            console.log('Éxito con cors:', json);
            return json;
        } else {
            const text = await response.text();
            console.error('Error HTTP con cors:', response.status, text);
            throw new Error(`HTTP ${response.status}: ${text}`);
        }
    } catch (err) {
        console.error('Error completo en fetch:', err);
        // En caso de fallo total, asumimos éxito si usamos no-cors (Apps Script suele procesar igual)
        if (payload.action === 'editarPublicacion') {
            return { success: true, message: 'Edición enviada (asumido por no-cors)' };
        }
        return { success: false, error: err.message };
    }
}

// Validación del formulario (mejorada y adaptada)
function validateForm() {
    let valid = true;
    hideMessages();

    const fields = [
        { id: 'titulo', name: 'Título' },
        { id: 'tipo', name: 'Tipo de operación' },
        { id: 'subtipo', name: 'Tipo de propiedad' },
        { id: 'precio', name: 'Precio' },
        { id: 'pais', name: 'País' },
        { id: 'descripcion', name: 'Descripción' }
    ];

    fields.forEach(field => {
        const el = document.getElementById(field.id);
        if (!el) return;

        const value = el.value.trim();

        if (!value && !isEditing) {
            valid = false;
            el.style.borderColor = '#e53e3e';
        } else {
            el.style.borderColor = '#e2e8f0';
        }
    });

    // Validación extra del precio
    const precioEl = document.getElementById('precio');
    if (precioEl && precioEl.value) {
        const precio = parseFloat(precioEl.value);
        if (isNaN(precio) || precio < 1000) {
            valid = false;
            precioEl.style.borderColor = '#e53e3e';
            showError('El precio debe ser mayor o igual a $1.000');
        }
    }

    return valid;
}

function loadPropertyForEdit(prop) {
    isEditing = true;
    
    const editIdField = document.getElementById('editId');
    if (!editIdField) {
        alert('Error: No se encontró el campo de edición');
        return;
    }

    editIdField.value = prop.id || prop.fila || prop.row || '';

    document.getElementById('titulo').value = prop.titulo || '';
    document.getElementById('tipo').value = prop.tipo || prop.tipoOperacion || '';
    document.getElementById('subtipo').value = prop.subtipo || prop.tipoPropiedad || '';
    document.getElementById('precio').value = prop.precio || '';
    document.getElementById('pais').value = prop.pais || '';
    document.getElementById('descripcion').value = prop.descripcion || '';

    // Limpiar y mostrar imágenes existentes
    imagePreview.innerHTML = '';
    uploadedImageUrls = [];

    if (prop.imagenes) {
        let urls = [];
        if (typeof prop.imagenes === 'string' && prop.imagenes.trim()) {
            urls = prop.imagenes.split(',').map(u => u.trim()).filter(u => u);
        } else if (Array.isArray(prop.imagenes)) {
            urls = prop.imagenes;
        }

        urls.forEach(url => {
            if (url && url.startsWith('http')) {
                const img = document.createElement('img');
                img.src = url;
                img.style.width = '110px';
                img.style.height = '110px';
                img.style.objectFit = 'cover';
                imagePreview.appendChild(img);
                uploadedImageUrls.push(url);
            }
        });
    }

    submitBtn.textContent = 'Guardar Cambios';
    showSection('form');   // Asegura que muestre el formulario
}

// ELIMINAR PROPIEDAD
// ============================================================================
async function eliminarPropiedad(id) {
    if (!id) {
        alert("Error: ID de propiedad no válido");
        return;
    }

    // Mostrar feedback al usuario
    const loadingMsg = document.createElement('div');
    loadingMsg.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#e53e3e; color:white; padding:12px 20px; border-radius:8px; z-index:9999;';
    loadingMsg.textContent = 'Eliminando propiedad...';
    document.body.appendChild(loadingMsg);

    try {
        const payload = {
            action: 'eliminarPublicacion',
            id: id.toString(),
            timestamp: new Date().toISOString(),
            origin: ORIGIN || 'https://inmobiliariaagustinsantos.com.ar'
        };

        const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',        // ← Usamos el mismo método que el resto de tu código
            cache: 'no-cache',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        console.log('Eliminación enviada (no-cors):', response.type);

        // Como usamos no-cors, no podemos leer la respuesta, pero asumimos éxito
        setTimeout(() => {
            loadingMsg.style.background = '#38a169';
            loadingMsg.textContent = '✅ Propiedad eliminada correctamente';
            
            // Recargar la lista automáticamente
            setTimeout(() => {
                loadingMsg.remove();
                loadMisPropiedades();
            }, 1500);
        }, 800);

    } catch (err) {
        console.error('Error al eliminar:', err);
        loadingMsg.style.background = '#e53e3e';
        loadingMsg.textContent = '❌ Error al eliminar. Inténtalo nuevamente.';
        
        setTimeout(() => loadingMsg.remove(), 3000);
    }
}

}

async function loadMisPropiedades() {
    const container = document.getElementById('propiedades-list');
    if (!container) return;

    container.innerHTML = '<div class="loading-msg">Cargando propiedades publicadas...</div>';

    try {
        const response = await fetch(`${WEB_APP_URL}?action=getPublicar&hoja=Publicar`);
        const data = await response.json();

        if (!data.success || !Array.isArray(data.publicaciones)) {
            container.innerHTML = '<div class="no-data-msg">No hay propiedades publicadas aún.</div>';
            return;
        }

        container.innerHTML = '';

        data.publicaciones.forEach(prop => {
            const card = document.createElement('div');
            card.className = 'property-card';

            let primeraImagen = 'https://via.placeholder.com/400x220?text=Sin+Imagen';
            if (prop.imagenes) {
                if (typeof prop.imagenes === 'string' && prop.imagenes.trim()) {
                    const partes = prop.imagenes.split(',');
                    if (partes.length > 0) {
                        const url = partes[0].trim();
                        if (url.startsWith('http')) primeraImagen = url;
                    }
                } else if (Array.isArray(prop.imagenes) && prop.imagenes.length > 0) {
                    primeraImagen = prop.imagenes[0];
                }
            }

            const precio = prop.precio
                ? `$${Number(prop.precio).toLocaleString('es-AR')}`
                : 'Consultar precio';

            card.innerHTML = `
                <img src="${primeraImagen}" alt="${prop.titulo || 'Propiedad'}" loading="lazy"
                     onerror="this.src='https://via.placeholder.com/400x220?text=Sin+Imagen'">
                <div class="property-info">
                    <div class="property-title">${prop.titulo || 'Sin título'}</div>
                    <div class="property-price">${precio}</div>
                    <div class="property-type">
                        ${prop.subtipo || ''} • ${prop.tipo || ''} • ${prop.pais || ''}
                    </div>
                    <div class="action-row">
                        <button class="btn-action btn-edit">Editar</button>
                        <button class="btn-action btn-delete">Eliminar</button>
                    </div>
                </div>
            `;

            card.querySelector('.btn-edit').onclick = () => loadPropertyForEdit(prop);

            // Botón Eliminar - Versión funcional
card.querySelector('.btn-delete').onclick = () => {

            container.appendChild(card);

imagenesInput.addEventListener('change', async e => {
    const files = Array.from(e.target.files);
    imagePreview.innerHTML = '';
    uploadedImageUrls = [];
    const validFiles = [];
    for (const file of files) {
        try {
            validarArchivo(file);
            validFiles.push(file);
            const reader = new FileReader();
            reader.onload = ev => {
                const img = document.createElement('img');
                img.src = ev.target.result;
                img.title = file.name;
                imagePreview.appendChild(img);
            };
            reader.readAsDataURL(file);
        } catch (err) {
            alert(err.message);
        }
    }
    if (validFiles.length) await subirImagenesMultiples(validFiles);
});

publicationForm.addEventListener('submit', async e => {
    e.preventDefault();
    hideMessages();

    if (!validateForm()) {
        return;
    }

    if (!uploadedImageUrls.length && !isEditing) {
        showError('Debes subir al menos una imagen');
        return;
    }

    showLoading();

    try {
        const datos = {
            titulo: document.getElementById('titulo').value.trim(),
            tipo: document.getElementById('tipo').value,
            subtipo: document.getElementById('subtipo').value,
            precio: parseFloat(document.getElementById('precio').value),
            pais: document.getElementById('pais').value,
            descripcion: document.getElementById('descripcion').value.trim()
        };

        const editId = document.getElementById('editId').value;
        const isEdit = !!editId;

        const res = await enviarPublicacionCompleta(datos, isEdit, editId);

        if (res.success || res.type === 'opaque') {
            showSuccess(isEdit);
            resetForm();

            // Si estábamos editando, volvemos a la lista
            if (isEdit) {
                setTimeout(() => {
                    showSection('propiedades');
                    loadMisPropiedades();
                }, 1800);
            }
        } else {
            showError(res.error || 'Error al guardar la publicación');
        }
    } catch (err) {
        showError(err.message || 'Error inesperado');
    } finally {
        hideLoading();
    }
});
