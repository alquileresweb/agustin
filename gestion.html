<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión - Inmobiliaria</title>
    <style>
        /* ───────────────────────────────────────────────────────────────
           ESTILOS EXISTENTES (sin cambios) + algunos nuevos
        ─────────────────────────────────────────────────────────────── */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #2d3748;
            line-height: 1.6;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .dashboard-header {
            background: linear-gradient(135deg, #4c51bf 0%, #667eea 100%);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            box-shadow: 0 4px 20px rgba(76,81,191,0.25);
        }
        .logo-container img {
            height: 70px;
            width: auto;
            border-radius: 8px;
            background: white;
            padding: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header-text h1 { font-size: 2.1rem; margin-bottom: 0.25rem; }
        .header-text p { opacity: 0.9; font-size: 1.05rem; }

        .quick-actions {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
        }
        .quick-actions h2 { margin-bottom: 1.5rem; color: #4a5568; }
        .action-buttons { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .btn-primary, .btn-secondary {
            padding: 1.1rem 2.5rem;
            font-size: 1.15rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(102,126,234,0.35);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(102,126,234,0.45); }
        .btn-secondary {
            background: linear-gradient(135deg, #38a169, #48bb78);
            color: white;
        }
        .btn-secondary:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(56,161,105,0.4); }

        /* Secciones ocultas por defecto */
        #form-section, #mis-propiedades-section { display: none; }

        /* Estilos para el listado de propiedades (igual que index.html) */
        .property-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin: 2rem 0;
        }
        .property-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .property-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.15);
        }
        .property-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .property-info {
            padding: 1.2rem;
            text-align: center;
        }
        .property-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: #2d3748;
        }
        .property-price {
            font-size: 1.4rem;
            color: #38a169;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .property-type {
            color: #718096;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .action-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .btn-action {
            padding: 0.7rem 1.4rem;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-edit { background: #3182ce; color: white; }
        .btn-edit:hover { background: #2b6cb0; }
        .btn-delete { background: #e53e3e; color: white; }
        .btn-delete:hover { background: #c53030; }

        .section-title {
            text-align: center;
            font-size: 1.8rem;
            margin: 1.5rem 0 1rem;
            color: #2d3748;
        }

        .loading, .no-data {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #718096;
        }

        @media (max-width: 768px) {
            .action-buttons { flex-direction: column; }
            .property-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="dashboard-header">
        <div class="logo-container">
            <img src="https://i.postimg.cc/NjpwgWCr/Whats-App-Image-2025-10-02-at-14-31-24.jpg" alt="Logo Inmobiliaria">
        </div>
        <div class="header-text">
            <h1>Panel de Gestión</h1>
            <p>Administración de anuncios inmobiliarios</p>
        </div>
    </div>

    <!-- Panel inicial con botones -->
    <div class="quick-actions" id="actionsPanel">
        <h2>¿Qué deseas hacer?</h2>
        <div class="action-buttons">
            <button class="btn-primary" id="btnPublicar">Publicar Nuevo Anuncio</button>
            <button class="btn-secondary" id="btnMisPropiedades">Mis Propiedades</button>
        </div>
    </div>

    <!-- Sección Publicar (ya existía) -->
    <div id="form-section">
        <div class="success" id="successMessage"></div>
        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loadingMessage">Procesando publicación...</div>

        <form id="publicationForm">
            <!-- ... (tu formulario completo sin cambios) ... -->
            <div class="form-group">
                <label for="titulo">Título de la Publicación *</label>
                <input type="text" id="titulo" required placeholder="Ej: Hermoso departamento 3 ambientes en Palermo" maxlength="100">
            </div>
            <!-- resto del form igual que antes -->
            <button type="submit" class="btn-primary btn-submit">Publicar Anuncio</button>
            <button type="button" class="btn-primary btn-back" id="btnVolverForm">← Volver al Panel</button>
        </form>
    </div>

    <!-- Nueva sección: Mis Propiedades -->
    <div id="mis-propiedades-section">
        <h2 class="section-title">Mis Propiedades Publicadas</h2>
        <div id="propiedades-list" class="property-grid">
            <div class="loading">Cargando tus propiedades...</div>
        </div>
        <button class="btn-primary" id="btnVolverPropiedades" style="display:block; margin:2rem auto;">← Volver al Panel</button>
    </div>
</div>

<script>
    // ───────────────────────────────────────────────────────────────
    // CONTROL DE VISIBILIDAD DE SECCIONES
    // ───────────────────────────────────────────────────────────────
    const actionsPanel   = document.getElementById('actionsPanel');
    const formSection    = document.getElementById('form-section');
    const propsSection   = document.getElementById('mis-propiedades-section');

    const btnPublicar    = document.getElementById('btnPublicar');
    const btnMisProps    = document.getElementById('btnMisPropiedades');
    const btnVolverForm  = document.getElementById('btnVolverForm');
    const btnVolverProps = document.getElementById('btnVolverPropiedades');

    function showSection(sectionToShow) {
        [actionsPanel, formSection, propsSection].forEach(s => {
            if (s) s.style.display = 'none';
        });
        if (sectionToShow) {
            sectionToShow.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    if (btnPublicar)    btnPublicar.addEventListener('click',     () => showSection(formSection));
    if (btnMisProps)    btnMisProps.addEventListener('click',     () => {
        showSection(propsSection);
        loadMisPropiedades();
    });
    if (btnVolverForm)  btnVolverForm.addEventListener('click',   () => showSection(actionsPanel));
    if (btnVolverProps) btnVolverProps.addEventListener('click',  () => showSection(actionsPanel));

    // ───────────────────────────────────────────────────────────────
    // VARIABLES GLOBALES
    // ───────────────────────────────────────────────────────────────
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxnHD1WpiGrdXpilPf7yU7wb4OQqTT_dqszP0UblAvbQclpeEdifirPyh1oVGIaF8omlA/exec';
    const ORIGIN = 'https://inmobiliariaagustinsantos.com.ar';

    const form              = document.getElementById('publicationForm');
    const submitButton      = document.querySelector('.btn-submit');
    const successMessage    = document.getElementById('successMessage');
    const errorMessage      = document.getElementById('errorMessage');
    const loadingMessage    = document.getElementById('loadingMessage');
    const imagePreview      = document.getElementById('imagePreview');
    const imagenesInput     = document.getElementById('imagenes');
    const uploadProgress    = document.getElementById('uploadProgress');
    const uploadProgressBar = document.getElementById('uploadProgressBar');

    let uploadedImageUrls = [];

    // ───────────────────────────────────────────────────────────────
    // CARGA DE PROPIEDADES (Mis Propiedades)
    // ───────────────────────────────────────────────────────────────
    async function loadMisPropiedades() {
        const container = document.getElementById('propiedades-list');
        if (!container) return;

        container.innerHTML = '<div class="loading">Cargando tus propiedades...</div>';

        try {
            const response = await fetch(`${WEB_APP_URL}?action=getPublicar&hoja=Publicar`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const result = await response.json();

            if (!result.success || !Array.isArray(result.publicaciones)) {
                container.innerHTML = '<div class="no-data">No se encontraron propiedades publicadas aún.</div>';
                return;
            }

            container.innerHTML = '';
            result.publicaciones.forEach(prop => {
                container.appendChild(createAdminPropertyCard(prop));
            });

        } catch (err) {
            console.error('Error cargando propiedades:', err);
            container.innerHTML = '<div class="no-data">Error al cargar las propiedades. Intenta más tarde.</div>';
        }
    }

    function createAdminPropertyCard(prop) {
        const card = document.createElement('div');
        card.className = 'property-card';

        const primeraImg = prop.imagenes?.split(',')[0]?.trim() || 'https://via.placeholder.com/400x220?text=Sin+Imagen';
        const precioFmt = prop.precio ? '$' + Number(prop.precio).toLocaleString('es-AR') : 'Consultar';

        card.innerHTML = `
            <img src="${primeraImg}" alt="${prop.titulo || 'Propiedad'}"
                 onerror="this.src='https://via.placeholder.com/400x220?text=Sin+Imagen'" loading="lazy">
            <div class="property-info">
                <div class="property-title">${prop.titulo || 'Sin título'}</div>
                <div class="property-price">${precioFmt}</div>
                <div class="property-type">
                    ${prop.subtipo || ''} - ${prop.tipo || ''} (${prop.pais || ''})
                </div>
                <div class="action-row">
                    <button class="btn-action btn-edit" data-id="${prop.id || ''}">Editar</button>
                    <button class="btn-action btn-delete" data-id="${prop.id || ''}">Eliminar</button>
                </div>
            </div>
        `;

        card.querySelector('.btn-edit').addEventListener('click', () => {
            alert(`Editar propiedad:\nID: ${prop.id || 'sin-id'}\nTítulo: ${prop.titulo || '?'}\n\n(Función de edición aún no implementada)`);
        });

        card.querySelector('.btn-delete').addEventListener('click', async () => {
            if (!confirm(`¿Eliminar "${prop.titulo || 'esta propiedad'}" de forma definitiva?`)) return;
            alert(`Solicitud de eliminación para ID: ${prop.id || 'sin-id'}\n\n(Función de eliminación aún no implementada en el backend)`);
            console.log('DELETE solicitada para ID:', prop.id);
            // Futuro: await fetch(`${WEB_APP_URL}?action=delete&id=${prop.id}&hoja=Publicar`);
            // Luego: loadMisPropiedades();
        });

        return card;
    }

    // ───────────────────────────────────────────────────────────────
    // CLOUDINARY CONFIG & FUNCTIONS
    // ───────────────────────────────────────────────────────────────
    const CLOUDINARY_CONFIG = {
        CLOUD_NAME: 'dn4tjz4ck',
        UPLOAD_PRESET: 'preset_alquileres',
        API_KEY: '742759356638557',
        API_URL: 'https://api.cloudinary.com/v1_1/dn4tjz4ck/image/upload',
        MAX_FILE_SIZE: 10 * 1024 * 1024,
        ALLOWED_TYPES: ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'],
        MAX_RETRIES: 3,
        TIMEOUT: 30000
    };

    async function verificarCorsCloudinary() {
        try {
            const res = await fetch(`https://res.cloudinary.com/${CLOUDINARY_CONFIG.CLOUD_NAME}/image/upload/w_1,h_1,c_fill/v1/test-cors.jpg`, {
                method: 'HEAD', mode: 'cors'
            });
            if (!res.ok) console.warn('Posible problema CORS con Cloudinary');
        } catch (e) {
            console.warn('Verificación CORS falló:', e);
        }
    }

    function validarArchivo(file) {
        if (file.size > CLOUDINARY_CONFIG.MAX_FILE_SIZE) {
            throw new Error(`Archivo demasiado grande (${(file.size/1024/1024).toFixed(1)} MB)`);
        }
        if (!CLOUDINARY_CONFIG.ALLOWED_TYPES.includes(file.type)) {
            throw new Error(`Tipo de archivo no permitido: ${file.type}`);
        }
        return file.type.startsWith('image/');
    }

    function crearFormData(file, options) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_CONFIG.UPLOAD_PRESET);
        if (options.folder) formData.append('folder', options.folder);
        return formData;
    }

    async function procesarArchivoIndividual(file, options) {
        const { retryCount = 0 } = options;
        if (!validarArchivo(file)) throw new Error(`Archivo inválido: ${file.name}`);

        const formData = crearFormData(file, options);

        try {
            const res = await fetch(CLOUDINARY_CONFIG.API_URL, {
                method: 'POST',
                mode: 'cors',
                cache: 'no-cache',
                credentials: 'omit',
                body: formData,
                signal: AbortSignal.timeout(CLOUDINARY_CONFIG.TIMEOUT)
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Cloudinary HTTP ${res.status}: ${errText}`);
            }

            const data = await res.json();
            if (data.secure_url) return data.secure_url;
            throw new Error('No se recibió secure_url');
        } catch (err) {
            if (retryCount < CLOUDINARY_CONFIG.MAX_RETRIES && 
                (err.name === 'TimeoutError' || err.message.includes('network'))) {
                await new Promise(r => setTimeout(r, 2000 * (retryCount + 1)));
                return procesarArchivoIndividual(file, { ...options, retryCount: retryCount + 1 });
            }
            throw err;
        }
    }

    async function subirImagenesCloudinary(files, options = {}) {
        const {
            onProgress = null,
            onSuccess = null,
            onError = null,
            maxFiles = 50,
            folder = 'alquileres'
        } = options;

        const urls = [];
        let processed = 0;
        const total = Math.min(files.length, maxFiles);

        await verificarCorsCloudinary();

        const batchSize = 3;
        for (let i = 0; i < total; i += batchSize) {
            const batch = files.slice(i, i + batchSize);
            const promises = batch.map((file, idx) =>
                procesarArchivoIndividual(file, {
                    ...options,
                    globalIndex: i + idx,
                    totalFiles: total,
                    retryCount: 0
                })
            );

            const results = await Promise.allSettled(promises);

            results.forEach((r, batchIdx) => {
                processed++;
                const globalIdx = i + batchIdx;
                if (r.status === 'fulfilled' && r.value) {
                    urls.push(r.value);
                    onProgress?.({ status: 'success', progress: (processed/total)*100 });
                    onSuccess?.(r.value);
                } else {
                    onProgress?.({ status: 'error', progress: (processed/total)*100 });
                    onError?.(r.reason, files[globalIdx]);
                }
            });

            if (i + batchSize < total) await new Promise(r => setTimeout(r, 1000));
        }

        return urls;
    }

    async function subirImagenesMultiples(files) {
        uploadedImageUrls = [];
        if (!uploadProgress || !uploadProgressBar) return { urls: [], exitosas: 0 };

        uploadProgress.style.display = 'block';
        uploadProgressBar.style.width = '0%';

        try {
            const urls = await subirImagenesCloudinary(files, {
                maxFiles: 50,
                folder: `alquileres/${Date.now()}`,
                onProgress: p => {
                    if (uploadProgressBar) uploadProgressBar.style.width = `${p.progress}%`;
                },
                onSuccess: url => uploadedImageUrls.push(url)
            });

            return { urls: uploadedImageUrls, exitosas: uploadedImageUrls.length };
        } catch (err) {
            console.error('Error subida masiva:', err);
            return { urls: [], exitosas: 0 };
        } finally {
            if (uploadProgress) uploadProgress.style.display = 'none';
            if (uploadProgressBar) uploadProgressBar.style.width = '0%';
        }
    }

    // ───────────────────────────────────────────────────────────────
    // ENVÍO DEL FORMULARIO
    // ───────────────────────────────────────────────────────────────
    if (form) {
        form.addEventListener('submit', async e => {
            e.preventDefault();
            hideMessages();

            if (!validateForm()) return;

            if (uploadedImageUrls.length === 0) {
                showError('Debes subir al menos una imagen correctamente');
                return;
            }

            showLoading();

            try {
                const data = {
                    titulo: document.getElementById('titulo')?.value.trim() || '',
                    tipo: document.getElementById('tipo')?.value || '',
                    subtipo: document.getElementById('subtipo')?.value || '',
                    precio: parseFloat(document.getElementById('precio')?.value) || 0,
                    pais: document.getElementById('pais')?.value || '',
                    descripcion: document.getElementById('descripcion')?.value.trim() || '',
                    timestamp: new Date().toISOString()
                };

                const result = await enviarPublicacionCompleta(data);

                if (result.success) {
                    showSuccess(result);
                    resetForm();
                } else {
                    showError(result.error || 'Error al publicar');
                }
            } catch (err) {
                console.error('Error publicación:', err);
                showError('Error de conexión o procesamiento');
            } finally {
                hideLoading();
            }
        });
    }

    // ───────────────────────────────────────────────────────────────
    // PREVISUALIZACIÓN Y SUBIDA AUTOMÁTICA DE IMÁGENES
    // ───────────────────────────────────────────────────────────────
    if (imagenesInput) {
        imagenesInput.addEventListener('change', async e => {
            const files = Array.from(e.target.files);
            if (imagePreview) imagePreview.innerHTML = '';
            uploadedImageUrls = [];

            let totalSize = 0;
            const validFiles = [];

            for (const file of files) {
                try {
                    validarArchivo(file);
                    totalSize += file.size;
                    validFiles.push(file);

                    const reader = new FileReader();
                    reader.onload = ev => {
                        const img = document.createElement('img');
                        img.src = ev.target.result;
                        img.title = file.name;
                        img.style.cssText = 'width:110px;height:110px;object-fit:cover;border-radius:8px;border:2px solid #e2e8f0;';
                        if (imagePreview) imagePreview.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                } catch (err) {
                    alert(`${file.name}: ${err.message}`);
                    e.target.value = '';
                    return;
                }
            }

            if (totalSize > 100 * 1024 * 1024) {
                alert('Tamaño total excede 100 MB');
                e.target.value = '';
                return;
            }

            if (validFiles.length > 0) {
                await subirImagenesMultiples(validFiles);
            }
        });
    }

    // ───────────────────────────────────────────────────────────────
    // FUNCIONES DE UI Y VALIDACIÓN
    // ───────────────────────────────────────────────────────────────
    function hideMessages() {
        if (successMessage) successMessage.style.display = 'none';
        if (errorMessage) errorMessage.style.display = 'none';
    }

    function showLoading() {
        if (loadingMessage) loadingMessage.style.display = 'block';
        if (submitButton) {
            submitButton.disabled = true;
            submitButton.textContent = 'Procesando...';
        }
    }

    function hideLoading() {
        if (loadingMessage) loadingMessage.style.display = 'none';
        if (submitButton) {
            submitButton.disabled = false;
            submitButton.textContent = 'Publicar Anuncio';
        }
    }

    function showSuccess(result) {
        if (!successMessage) return;
        successMessage.innerHTML = `
            ¡Publicación exitosa!<br>
            <strong>${result.message || 'Guardado correctamente'}</strong><br>
            <small>ID: ${result.publicacion?.id || '—'}</small>
        `;
        successMessage.style.display = 'block';
    }

    function showError(msg) {
        if (!errorMessage) return;
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
    }

    function validateForm() {
        let valid = true;
        // Aquí puedes agregar todas tus validaciones específicas
        // Por ahora un chequeo básico:
        ['titulo','tipo','subtipo','precio','pais','descripcion'].forEach(id => {
            const el = document.getElementById(id);
            if (el && !el.value.trim()) valid = false;
        });
        return valid;
    }

    function resetForm() {
        if (form) form.reset();
        if (imagePreview) imagePreview.innerHTML = '';
        uploadedImageUrls = [];
        if (uploadProgress) uploadProgress.style.display = 'none';
    }

    // Inicialización
    console.log('Panel de Gestión v2 – inicializado');
</script>
</body>
</html>
